# ---------------------------------------------------------------- sweeps (M7)
# One [sweeps.NAME] per bash run_BENCH_* / run_BENCHY_WITH_SERVER_* / run_INSPECT_* function (`bash` = which one),
# generated from the script's extras_list arrays: every entry in order, with its comment as `note`.
#   status = "on"    runs with `mse-llm sweep run NAME` (it was not commented out in bash)
#   status = "off"   was commented out: runs with --include-off (or flip it to "on", or use --match GLOB)
#   status = "skip"  a "PC freeze" note: never started without --force
#   tag              sweetspot | freeze | sporadic-freeze | skipped (from the note)
# Every job is checked with `fit` first (a no-fit variant is recorded as skipped) and runs under the memory guard.
# Optional per sweep: prompts = [..] (bench: one llama-bench run per -p size, bash _wrapper_PROMPTS), tg = [..],
# repetitions = N; benchy: pp = [..], depth = [..], runs = N, concurrency = [..]. Unset = [defaults].
# A structured matrix works too: matrix = { ctk=["q8_0"], ctv=["q8_0","q4_0"], b_ub=[[2048,2048]], n_cpu_moe=[18,21] }

