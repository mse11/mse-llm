[sweeps.Qwen36_35B_A3B_UD_Q4_K_M_MTP_moecache]
# M11 (§4.4): MoE expert cache, staged; each stage starts from the winner of the ones before ({best} / {winner},
# mse_llm/staged.py). The cache is used for small batches only (decode, drafting), so the goal is TG; PP at a short
# and a long prompt shows it stays the same. Cache runs warm the cache first (512 generated tokens), and their server
# is stopped with Ctrl+C so the cache prints its hit rate. llama-bench has no --moe-cache-*, so this is benchy.
# The same template fits gemma_4_26B_A4b_QAT_UD_Q4_K_XL (baseline b2048_ub2048_moe16, spec moe21_sd4mtp),
# Qwen36_28B_REAP20_A3B_Q4_K_M (b4096_ub4096_moe41) and GLM (moe49).
model = "Qwen36_35B_A3B_UD_Q4_K_M_MTP"
tool = "benchy"
ctx = 65536
pp = [512, 8192]
tg = [512]
runs = 2
warmup = 512
goal = "tg"
stages = [
  # 0. baselines: the serve sweet spot (no cache), with each load mode
  ["fa_Kq8_Vq8_default_moe34_lm{N,A,D}"],
  # 1. all experts in RAM + cache size, at share 0 and 0.95, pinned (none) and dio
  ["fa_Kq8_Vq8_default_cmoe_mc{2048,4096,6144}_cs{0,95}_lm{N,D}"],
  # 2. share at the best size and load mode of stage 1
  ["fa_Kq8_Vq8_default_cmoe_mc{best}_cs{0,50,80,90,95}_lm{best}"],
  # 3. cache on top of partial offload, then MTP drafting on top of the stage-2 winner. moe34 + a 6 GiB cache is
  #    NO-FIT at ctx 65536 (-205 MiB, with sd3mtp -818), so the partial offload starts at moe37.
  #    "{winner}" keeps the stage-2 winner in the race (stored run, nothing new), so stage 4 starts from the best one.
  ["{winner}", "fa_Kq8_Vq8_default_moe{37,38}_mc{best}_cs{best}_lm{best}", "{winner}_sd3mtp"],
  # 4. K/V type at the winner
  ["{winner}_K{q8,f8}_V{q8,f8,q4}"],
]

