# mse-llm configuration (IMPLEMENTATION_PLAN.md §4.1).
# Copy to config/config.toml for your own changes; mse-llm reads config.toml first, then this file.
# Env overrides: MSE_LLM_<FIELD> for [defaults] (e.g. MSE_LLM_THREADS=8),
#                MSE_LLM_BENCHY_<FIELD> for [defaults.benchy] (e.g. MSE_LLM_BENCHY_PP="512 2048").

[defaults]
threads = 4                 # bash MSE_THREADS
parallel = 1                # bash MSE_PARALLEL
ngl = "all"                 # bash -ngl 999 (llama-bench gets 999: it takes numbers only)
fit = "off"                 # bench/benchy/eval servers: measured config = requested config (serve uses --fit on, §0.3)
load_mode = "none"          # replaces the removed --no-mmap; bash MODELS_BENCH_EXTRA["common"] = "-lm none"
bench_tg = [128]            # bash MSE_BENCH_TG
bench_repetitions = 1       # llama-bench -r (bash used the implicit default 5)
server_ready_timeout = 120  # bash MSE_SERVER_READY_TIMEOUT (was 30)
notify = true
monitor = true              # bash MSE_MONITOR_ENABLED
output = "filter"           # all | filter | none (bash EXEC_cmd_with_output_mode)
# output_filter = ["llama_context: n_ctx", "[Ee]rror"]   # regexes for --output filter; default: bash run_serve_params_FILTER

[defaults.benchy]
pp = [512, 2048, 8192, 32768]   # bash MSE_BENCHY_PP
pp_sync_ctx = true              # bash MSE_BENCHY_PP_SYNCH: benchy --pp = the server context
depth = [0]                     # bash MSE_BENCHY_DEPTH
runs = 1                        # bash MSE_BENCHY_RUNS
version = "llama-benchy"        # pin, e.g. "llama-benchy==0.3.1", for reproducible results

# Engines: "cuda_flash" comes from config/builds/rtx4080-laptop.toml [engine]
# (bin_dir = builds\llama.cpp\build\bin\Release). Override or add more here, for example:
# [engines.cuda_flash]
# help_snapshot = "a49db739f"   # folder in tests/fixtures/help/ that `doctor flags` and command checks use

[monitor]                   # §5 / §9 item 7: in-process sampling (NVML, PDH, psutil) + memory guard
interval = 0.5              # seconds (bash: ~2 s per sample, with powershell + nvidia-smi calls)
guard = true                # stop the server on a GPU memory spill, RAM or commit trip (serve / presets serve)
spill_stop_mib = 100        # bash "shared delta > 100 MiB"; here counted after the host buffers fit expects
vram_full_mib = 256         # dedicated VRAM counts as full below this much free
host_tolerance_pct = 2.0    # allowed error of fit's host-buffer size (measured: 0.5 %)
ram_stop_pct = 95.0
commit_stop_pct = 95.0
stall_stop_s = 90           # bench / benchy: stop when GPU idle + no disk reads + VRAM unchanged this long (0 = off)
# job_memory_cap_mib = 40000  # Windows Job Object cap on the server tree's commit; on WDDM VRAM counts too
ram_warn_pct = 60.0         # bash status thresholds
ram_fail_pct = 80.0
temp_warn_c = 75.0
temp_fail_c = 85.0

[hw.checks]
ram_warn_gb = 16
ram_pass_gb = 32
cores_warn = 4
cores_pass = 8
disk_warn_gb = 25
disk_pass_gb = 60

[presets]
file = "llama_cpp_presets.ini"   # bash MSE_PRESETS_SERVE_FILE; switches to config/presets.ini in M13
# engine = "cuda_flash"          # which llama-server binary (default: cuda_flash)
# port = 8033                    # default: the engine's port
models_max = 1                   # 12 GB VRAM: one large model at a time (router default: 4)
memory_margin_mib = 1024         # router unloads LRU models to keep this much VRAM free (mmproj is not counted)
autoload = true                  # load a model on its first request (false: --no-models-autoload)
load_on_start = []               # e.g. ["Qwen3.6-35B-A3B-UD-Q4_K_M-MTP"]: loaded right after the router is up

# Models: the bash MODELS / DRAFTER_MODELS / MODELS_SERVE_EXTRA / MODELS_BENCH_EXTRA maps (F2), with the
# script's comments (HF URLs, sizes, capabilities, bench notes) as url / notes. Keys are the bash keys, so
# `mse-llm serve Qwen36_28B_REAP20_A3B_Q4_K_M` is `run_SERVER_Qwen36_28B_REAP20_A3B_Q4_K_M_CTX_cuda_flash`.
# ctx           = the runner_ctx default of the model's run_SERVER_* / run_BENCH_* functions.
# default_serve = the variant its run_SERVER_* serves; default_serve_spec = the SD/MTP alternative (--spec).
# alias         = the section name in llama_cpp_presets.ini (router model id).
# serve_extra   = MODELS_SERVE_EXTRA minus "-lm none" ([defaults].load_mode), in the same order.

