; Global options shared by all presets (llama.cpp router: the section must be named [*]).
; Model sections override these; command-line args override both.
; Router-owned keys are ignored here: host, port, api-key (set them on the command line).
; Clients select a model by its SECTION name; `alias` adds extra names for it.
; Checked against llama.cpp a49db739f (b12468-5).
