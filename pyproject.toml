[project]
name = "mse-llm"
version = "0.1.0"
description = "Benchmark, tune and serve local LLMs (llama.cpp first, other engines later)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "rich>=13.7",
    "psutil>=6.0",
    "nvidia-ml-py>=12.535",
    "pywin32>=306; sys_platform == 'win32'",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "jinja2>=3.1.6",
]

[project.scripts]
mse-llm = "mse_llm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mse_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
